version: v2
plugins:
  # Generate OpenAPI spec for ConnectRPC with a version-pinned Buf plugin.
  # API metadata is applied by api/scripts/inject-oauth-scopes.py because
  # remote plugins intentionally disable local base files.
  - remote: buf.build/community/sudorandom-connect-openapi:v0.21.3
    out: ../api/openapi
    opt:
      - format=json
      - path=openapi.internal.yaml
      - features=connectrpc;gnostic;protovalidate
      - allow-get
