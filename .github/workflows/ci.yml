name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto:
    name: Proto / lint, generate, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache: true

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: "1.71.0"

      - name: Lint protobuf contracts
        run: buf lint

      - name: Verify generated Go contracts
        run: |
          buf generate --template buf.gen.go.yaml
          git diff --exit-code -- '*.pb.go' '*.connect.go'

      - name: Verify module metadata
        run: go mod tidy -diff

      - name: Test generated packages
        run: go test ./...

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - proto
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          PROTO_RESULT: ${{ needs.proto.result }}
        run: test "$PROTO_RESULT" = success
